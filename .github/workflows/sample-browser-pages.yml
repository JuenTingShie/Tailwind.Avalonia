name: Deploy Browser Sample to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/Tailwind.Avalonia/**'
      - 'samples/Tailwind.Avalonia.Sample.Browser/**'
      - 'samples/Tailwind.Avalonia.Sample/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/Tailwind.Avalonia/**'
      - 'samples/Tailwind.Avalonia.Sample.Browser/**'
      - 'samples/Tailwind.Avalonia.Sample/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.202
          workloads: wasm-tools

      - name: Run tests
        run: dotnet test tests/Tailwind.Avalonia.Tests/Tailwind.Avalonia.Tests.csproj -c Release

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6.0.0

      - name: Publish browser sample
        if: github.event_name == 'push'
        run: dotnet publish samples/Tailwind.Avalonia.Sample.Browser/Tailwind.Avalonia.Sample.Browser.csproj -c Release

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: samples/Tailwind.Avalonia.Sample.Browser/bin/Release/net10.0-browser/publish/wwwroot

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ 'github-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
